<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Local Service Runner</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%236366f1' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3E%3Crect x='2' y='3' width='20' height='18' rx='2'/%3E%3Cpath d='m7 8 4 4-4 4'/%3E%3Cline x1='13' x2='17' y1='16' y2='16'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./css/variables.css">
  <link rel="stylesheet" href="./css/main.css">
  <link rel="stylesheet" href="./css/components.css">
  <script>
    // Applied before first paint so a light-theme user never sees a dark flash.
    try {
      document.documentElement.dataset.theme =
        localStorage.getItem('lsr.theme') === 'light' ? 'light' : 'dark';
    } catch { document.documentElement.dataset.theme = 'dark'; }
  </script>
</head>
<body>
  <div class="app">
    <header class="header">
      <span class="header__title"><span id="logo" class="header__logo"></span>Local Service Runner</span>
      <div class="header__search">
        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
        <input id="search" type="search" placeholder="Search by name, folder, port, framework, group…" aria-label="Search projects">
      </div>
      <div class="header__actions">
        <span class="header__running">
          <span id="live-status" class="live" data-state="polling" title="Connecting…"></span>
          <span id="running-count" role="status">0/0 running</span>
        </span>
        <button id="theme-toggle" class="switch-theme" title="Toggle theme" aria-label="Toggle light or dark theme" aria-pressed="false">
          <span class="switch-theme__thumb"></span>
        </button>
        <button id="add-project" class="btn btn--primary">Add Project</button>
        <button id="import-scripts" class="btn">Import Scripts</button>
        <button id="stop-all" class="btn">Stop All</button>
      </div>
    </header>

    <div id="status-filters" class="status-cards" aria-label="Filter by status">
      <button class="status-card status-card--all" data-status="all" title="Show all services" aria-pressed="true">
        <span class="status-card__label">All</span>
        <span class="status-card__count">0</span>
      </button>
      <button class="status-card" data-status="running" title="Show running services" aria-pressed="false">
        <span class="status-card__dot status-card__dot--running"></span>
        <span class="status-card__label">Running</span>
        <span class="status-card__count">0</span>
      </button>
      <button class="status-card" data-status="stopped" title="Show stopped services" aria-pressed="false">
        <span class="status-card__dot status-card__dot--stopped"></span>
        <span class="status-card__label">Stopped</span>
        <span class="status-card__count">0</span>
      </button>
      <button class="status-card" data-status="starting" title="Show starting services" aria-pressed="false">
        <span class="status-card__dot status-card__dot--starting"></span>
        <span class="status-card__label">Starting</span>
        <span class="status-card__count">0</span>
      </button>
      <button class="status-card" data-status="crashed" title="Show crashed services" aria-pressed="false">
        <span class="status-card__dot status-card__dot--crashed"></span>
        <span class="status-card__label">Crashed</span>
        <span class="status-card__count">0</span>
      </button>
    </div>

    <nav id="profiles" class="profiles" aria-label="Profiles" hidden></nav>

    <nav id="recent" class="recent" aria-label="Recent projects" hidden>
      <span class="recent__label">Recent</span>
      <div class="recent__list"></div>
    </nav>

    <main id="groups" class="main"></main>
  </div>

  <script type="module" src="./js/main.js"></script>
</body>
</html>
